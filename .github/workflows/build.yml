name: Build
on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        shell: bash
        run: |
          set +e
          gradle assembleDebug --stacktrace > build.log 2>&1
          status=$?
          cat build.log
          if [ "$status" -ne 0 ]; then
            grep -n -E '(^e: | error: |FAILURE:|What went wrong|Could not|Exception|Unresolved reference|does not exist|Execution failed)' build.log | tail -n 250 > errors.log || true
            split -C 3500 errors.log error-part- || true
            for part in error-part-*; do
              [ -f "$part" ] || continue
              message=$(cat "$part" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
              echo "::error title=Gradle build failed::$message"
            done
          fi
          exit "$status"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tobi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
